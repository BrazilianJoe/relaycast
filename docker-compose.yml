services:
  relay:
    build:
      context: ./relay
    image: relaycast-relay:local
    container_name: relaycast-relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_RTMP: rtmp://mediamtx:1935
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s
    networks:
      - cast

  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    container_name: relaycast-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"
      - "8890:8890/udp"
      - "8890:8890/tcp"
      - "8888:8888"
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - cast

  caddy:
    image: caddy:2-alpine
    container_name: relaycast-caddy
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    networks:
      - cast

networks:
  cast:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
