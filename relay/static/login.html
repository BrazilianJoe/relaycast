<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>relaycast login</title>
  <link rel="stylesheet" href="/static/app.css?v=2" />
  <style>
    .login { max-width: 22rem; margin: 12vh auto; }
    .login form { display: grid; gap: 0.7rem; }
    .login label { display: grid; gap: 0.25rem; font-size: 0.8rem; color: var(--muted); }
    .login button { padding: 0.45rem 0.7rem; justify-self: start; }
    .err { color: var(--bad); font-size: 0.88rem; }
  </style>
</head>
<body>
  <section class="panel login">
    <h1>relaycast</h1>
    <p class="hint">Admin sign-in.</p>
    <p class="err" id="err" hidden>Wrong user or password.</p>
    <form method="post" action="/login">
      <input type="hidden" name="next" id="next" value="/" />
      <label>user <input name="username" type="text" autocomplete="username" required /></label>
      <label>password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">open</button>
    </form>
  </section>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("err")) document.getElementById("err").hidden = false;
    const next = q.get("next") || "/";
    if (next.startsWith("/") && !next.startsWith("//")) document.getElementById("next").value = next;
  </script>
</body>
</html>
